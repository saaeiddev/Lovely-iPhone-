name: Deploy Lovely iPhone to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore the supplied 3D iPhone model
        run: python3 scripts/restore-model.py
      - name: Install browser validation tools
        run: |
          npm install --prefix /tmp/lovely-tests playwright@1.51.1
          /tmp/lovely-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify desktop and mobile interactions
        run: NODE_PATH=/tmp/lovely-tests/node_modules node scripts/smoke.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: /tmp/lovely-*.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
