<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#06070a" />
  <title>Lovely iPhone — Interactive 3D</title>
  <style>
    :root{
      --phone-w: 330px;
      --phone-h: 674px;
      --depth: 24px;
      --radius: 54px;
      --glass: rgba(255,255,255,.16);
      --glass-strong: rgba(255,255,255,.24);
      --line: rgba(255,255,255,.28);
      --shadow: rgba(0,0,0,.55);
      --rx: -4deg;
      --ry: -14deg;
      --zoom: 1;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
      color:#fff;
      background:
        radial-gradient(circle at 18% 20%,rgba(89,107,255,.18),transparent 28%),
        radial-gradient(circle at 82% 75%,rgba(0,220,190,.14),transparent 30%),
        radial-gradient(circle at 70% 14%,rgba(255,90,160,.12),transparent 22%),
        linear-gradient(145deg,#030407 0%,#090b12 48%,#030407 100%);
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }
    body:before{
      content:"";
      position:fixed;inset:-30%;
      background:conic-gradient(from 15deg,transparent,rgba(255,255,255,.025),transparent 22%,rgba(80,120,255,.05),transparent 50%);
      filter:blur(40px);
      animation:ambient 18s linear infinite;
      pointer-events:none
    }
    @keyframes ambient{to{transform:rotate(360deg)}}
    .scene{
      position:relative;width:100%;height:100%;
      perspective:1600px;
      display:grid;place-items:center;
      isolation:isolate
    }
    .halo{
      position:absolute;
      width:min(74vw,800px);height:min(74vw,800px);
      border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.09),rgba(110,130,255,.06) 34%,transparent 69%);
      filter:blur(22px);
      transform:translateY(10px);
      pointer-events:none
    }
    .titlebar{
      position:fixed;z-index:20;top:28px;left:50%;transform:translateX(-50%);
      text-align:center;pointer-events:none
    }
    .titlebar h1{font-size:clamp(20px,2.2vw,34px);margin:0;font-weight:650;letter-spacing:-.04em}
    .titlebar p{margin:7px 0 0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.48)}
    .hint{
      position:fixed;z-index:20;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
      font-size:12px;color:rgba(255,255,255,.56);
      border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.07);
      backdrop-filter:blur(18px) saturate(140%);
      -webkit-backdrop-filter:blur(18px) saturate(140%);
      border-radius:999px;padding:10px 15px;
      box-shadow:0 12px 40px rgba(0,0,0,.25);
      pointer-events:none;white-space:nowrap
    }
    .phone-wrap{
      width:var(--phone-w);height:var(--phone-h);
      transform-style:preserve-3d;
      transform:scale(var(--zoom));
      transition:transform .25s ease;
      position:relative
    }
    .phone{
      width:100%;height:100%;position:relative;
      transform-style:preserve-3d;
      transform:rotateX(var(--rx)) rotateY(var(--ry));
      transition:transform .08s linear;
      will-change:transform
    }
    .phone.resting{animation:float 5.5s ease-in-out infinite}
    @keyframes float{
      0%,100%{transform:rotateX(var(--rx)) rotateY(var(--ry)) translateY(-3px)}
      50%{transform:rotateX(calc(var(--rx) + 1.5deg)) rotateY(calc(var(--ry) + 2deg)) translateY(8px)}
    }
    .face{position:absolute;inset:0;border-radius:var(--radius);overflow:hidden;backface-visibility:hidden}
    .front{
      transform:translateZ(calc(var(--depth)/2));
      padding:6px;
      background:linear-gradient(145deg,#e4e6eb,#747980 25%,#202328 56%,#90959c 78%,#f4f5f7);
      box-shadow:
        0 45px 80px rgba(0,0,0,.58),
        0 18px 35px rgba(0,0,0,.36),
        inset 0 0 0 1px rgba(255,255,255,.85),
        inset 0 0 0 3px rgba(20,22,27,.8)
    }
    .back{
      transform:rotateY(180deg) translateZ(calc(var(--depth)/2));
      background:
        radial-gradient(circle at 25% 15%,rgba(255,255,255,.11),transparent 25%),
        linear-gradient(135deg,#292d31,#121518 52%,#24282c);
      border:1px solid rgba(255,255,255,.28);
      box-shadow:inset 0 0 30px rgba(255,255,255,.035)
    }
    .side{position:absolute;background:linear-gradient(90deg,#70757b,#c5c8cc 28%,#31353a 62%,#9a9fa5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
    .side.left,.side.right{width:var(--depth);height:calc(100% - 74px);top:37px;border-radius:12px}
    .side.left{left:calc(var(--depth)/-2);transform:rotateY(90deg)}
    .side.right{right:calc(var(--depth)/-2);transform:rotateY(90deg)}
    .side.top,.side.bottom{height:var(--depth);width:calc(100% - 74px);left:37px;border-radius:12px}
    .side.top{top:calc(var(--depth)/-2);transform:rotateX(90deg)}
    .side.bottom{bottom:calc(var(--depth)/-2);transform:rotateX(90deg)}
    .screen{
      position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;
      background:
        radial-gradient(circle at 20% 18%,rgba(255,188,211,.96),transparent 28%),
        radial-gradient(circle at 76% 18%,rgba(80,179,255,.9),transparent 30%),
        radial-gradient(circle at 58% 65%,rgba(95,74,255,.86),transparent 35%),
        radial-gradient(circle at 18% 82%,rgba(0,239,185,.72),transparent 31%),
        linear-gradient(150deg,#153a7c 0%,#28195b 54%,#0e1831 100%);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.88);
      border:1px solid #090a0d
    }
    .screen:before{
      content:"";position:absolute;inset:-25%;
      background:conic-gradient(from 230deg at 50% 50%,transparent 0 18%,rgba(255,255,255,.22) 24%,transparent 31% 52%,rgba(255,255,255,.09) 63%,transparent 72%);
      filter:blur(28px);animation:wallpaper 13s ease-in-out infinite alternate
    }
    @keyframes wallpaper{to{transform:translate(8%,5%) rotate(12deg) scale(1.08)}}
    .screen-content{position:absolute;inset:0;padding:13px 17px 16px;display:flex;flex-direction:column}
    .status{
      height:26px;display:flex;align-items:center;justify-content:space-between;
      padding:0 8px 0 7px;font-size:12px;font-weight:700;letter-spacing:.01em;text-shadow:0 1px 8px rgba(0,0,0,.35);z-index:4
    }
    .signals{display:flex;align-items:center;gap:6px}
    .bars{display:flex;gap:1.5px;align-items:flex-end;height:10px}
    .bars i{display:block;width:2.4px;background:white;border-radius:2px}
    .bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:10px}
    .wifi{font-size:10px}.battery{width:19px;height:9px;border:1px solid rgba(255,255,255,.85);border-radius:3px;position:relative}
    .battery:after{content:"";position:absolute;right:-3px;top:2px;width:1.5px;height:4px;border-radius:1px;background:rgba(255,255,255,.75)}
    .battery b{display:block;height:5px;width:13px;margin:1px;background:#fff;border-radius:1.5px}
    .island{
      position:absolute;z-index:5;top:11px;left:50%;transform:translateX(-50%);
      width:91px;height:25px;border-radius:18px;background:#050506;
      box-shadow:0 1px 0 rgba(255,255,255,.08),0 4px 11px rgba(0,0,0,.28)
    }
    .island:after{content:"";position:absolute;right:10px;top:8px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2c6176,#071018 58%,#000);box-shadow:0 0 3px rgba(0,155,255,.15)}
    .hero-widget{
      margin:18px 2px 14px;display:flex;justify-content:space-between;align-items:flex-end;min-height:86px;z-index:2
    }
    .clockbox{filter:drop-shadow(0 4px 14px rgba(0,0,0,.22))}
    .clock{font-size:53px;line-height:.9;font-weight:300;letter-spacing:-.065em}
    .date{margin-top:9px;font-size:12px;font-weight:600;color:rgba(255,255,255,.86)}
    .mini-weather{
      min-width:88px;padding:11px 12px;border-radius:21px;
      background:linear-gradient(150deg,rgba(255,255,255,.24),rgba(255,255,255,.09));
      border:1px solid rgba(255,255,255,.25);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 24px rgba(0,0,0,.18);
      backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
      position:relative;overflow:hidden
    }
    .mini-weather:before{content:"";position:absolute;inset:-30%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.28),transparent);transform:translateX(-70%) rotate(10deg);animation:shine 6s ease-in-out infinite}
    @keyframes shine{50%,100%{transform:translateX(90%) rotate(10deg)}}
    .mini-weather strong{font-size:25px;font-weight:500}.mini-weather small{display:block;font-size:9px;margin-top:3px;color:rgba(255,255,255,.75)}
    .apps{
      display:grid;grid-template-columns:repeat(4,1fr);gap:15px 13px;padding:0 2px;z-index:2;flex:1;align-content:start
    }
    .app{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
    .icon{
      width:50px;height:50px;border-radius:13px;display:grid;place-items:center;
      position:relative;overflow:hidden;
      background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.1));
      border:1px solid rgba(255,255,255,.34);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 7px 16px rgba(0,0,0,.18);
      backdrop-filter:blur(13px) saturate(170%);-webkit-backdrop-filter:blur(13px) saturate(170%);
      transition:transform .18s ease,filter .18s ease
    }
    .icon:before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.35),transparent 44%);mix-blend-mode:screen}
    .app:hover .icon{transform:scale(1.07) translateY(-2px);filter:brightness(1.07)}
    .glyph{position:relative;z-index:2;font-size:24px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.24))}
    .label{font-size:8.8px;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.7)}
    .messages .icon{background:linear-gradient(145deg,rgba(82,255,128,.82),rgba(20,173,79,.58))}
    .phoneapp .icon{background:linear-gradient(145deg,rgba(73,255,124,.82),rgba(9,155,61,.62))}
    .camera .icon{background:linear-gradient(145deg,rgba(245,245,250,.7),rgba(120,128,140,.34))}
    .photos .icon{background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(255,255,255,.28))}
    .music .icon{background:linear-gradient(145deg,rgba(255,95,145,.82),rgba(221,34,92,.58))}
    .safari .icon{background:linear-gradient(145deg,rgba(98,206,255,.85),rgba(30,102,234,.55))}
    .maps .icon{background:linear-gradient(145deg,rgba(123,230,164,.76),rgba(73,160,243,.55))}
    .settings .icon{background:linear-gradient(145deg,rgba(190,196,208,.72),rgba(92,101,116,.55))}
    .mail .icon{background:linear-gradient(145deg,rgba(85,190,255,.84),rgba(34,92,226,.58))}
    .notes .icon{background:linear-gradient(180deg,rgba(255,242,130,.92) 0 27%,rgba(255,255,255,.68) 27% 100%)}
    .clockapp .icon{background:linear-gradient(145deg,rgba(27,28,31,.88),rgba(8,8,10,.74))}
    .health .icon{background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(245,235,245,.55))}
    .dock{
      z-index:2;height:67px;margin-top:9px;border-radius:25px;padding:8px 10px;
      display:grid;grid-template-columns:repeat(4,1fr);gap:9px;
      background:linear-gradient(145deg,rgba(255,255,255,.25),rgba(255,255,255,.105));
      border:1px solid rgba(255,255,255,.3);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.33),0 10px 28px rgba(0,0,0,.2);
      backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%)
    }
    .dock .icon{width:49px;height:49px}.dock .app{gap:0}.dock .label{display:none}
    .homebar{position:absolute;z-index:5;bottom:6px;left:50%;transform:translateX(-50%);width:102px;height:4px;border-radius:8px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.22)}
    .toast{
      position:absolute;z-index:10;left:50%;top:50px;transform:translate(-50%,-12px) scale(.96);
      padding:8px 13px;border-radius:15px;opacity:0;pointer-events:none;
      font-size:10px;font-weight:650;letter-spacing:.01em;
      background:rgba(20,22,27,.6);border:1px solid rgba(255,255,255,.2);
      backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
      box-shadow:0 10px 28px rgba(0,0,0,.3);
      transition:.28s ease
    }
    .toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
    .camera-bump{
      position:absolute;left:20px;top:21px;width:132px;height:132px;border-radius:36px;
      background:linear-gradient(145deg,#34393e,#16191c 58%,#42474c);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 8px 20px rgba(0,0,0,.36),inset 0 1px 1px rgba(255,255,255,.16)
    }
    .lens{position:absolute;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 46% 43%,#17314b 0 8%,#071017 11% 25%,#152332 27% 33%,#020304 36% 59%,#181b1e 62% 71%,#060708 74%);border:3px solid #555c61;box-shadow:inset 0 0 0 2px #0b0c0e,0 3px 7px rgba(0,0,0,.48)}
    .lens.l1{left:12px;top:11px}.lens.l2{right:12px;top:40px}.lens.l3{left:18px;bottom:10px}
    .flash{position:absolute;right:22px;top:13px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff8cd,#e7d894 55%,#6f6e64 70%);box-shadow:0 0 7px rgba(255,245,194,.28)}
    .lidar{position:absolute;right:21px;bottom:16px;width:13px;height:13px;border-radius:50%;background:#111416;border:2px solid #3f4448}
    .applemark{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);font-size:56px;color:rgba(255,255,255,.17);font-family:Arial,sans-serif;filter:blur(.1px)}
    .back-title{position:absolute;bottom:55px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.16em;color:rgba(255,255,255,.24);text-transform:uppercase}
    .button{
      position:absolute;z-index:3;background:linear-gradient(180deg,#9da2a8,#484d53 55%,#777c82);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)
    }
    .power{right:-15px;top:165px;width:4px;height:85px;border-radius:0 3px 3px 0;transform:translateZ(2px)}
    .vol1,.vol2,.action{left:-15px;width:4px;border-radius:3px 0 0 3px;transform:translateZ(2px)}
    .action{top:98px;height:31px}.vol1{top:151px;height:60px}.vol2{top:224px;height:60px}
    .ground{
      position:absolute;left:50%;top:calc(50% + 330px);transform:translateX(-50%) rotateX(72deg);
      width:430px;height:150px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.72),rgba(0,0,0,.25) 43%,transparent 70%);
      filter:blur(13px);pointer-events:none;z-index:-1
    }
    @media(max-height:760px){:root{--phone-w:282px;--phone-h:577px}.titlebar{top:16px}.hint{bottom:12px}.clock{font-size:44px}.apps{gap:10px 11px}.icon{width:43px;height:43px}.glyph{font-size:20px}.dock{height:59px}.dock .icon{width:42px;height:42px}.hero-widget{margin-top:13px;min-height:72px}.camera-bump{transform:scale(.86);transform-origin:top left}}
    @media(max-width:520px){:root{--phone-w:278px;--phone-h:568px}.titlebar{top:20px}.titlebar p{display:none}.hint{font-size:10px;padding:8px 12px}.clock{font-size:43px}.icon{width:42px;height:42px}.dock .icon{width:41px;height:41px}.apps{gap:10px 9px}.screen-content{padding-left:15px;padding-right:15px}}
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Interactive three-dimensional iPhone">
    <div class="halo"></div>
    <header class="titlebar">
      <h1>Lovely iPhone</h1>
      <p>Interactive iOS 27 Concept</p>
    </header>

    <div class="phone-wrap" id="phoneWrap">
      <div class="phone resting" id="phone">
        <div class="side left"></div><div class="side right"></div><div class="side top"></div><div class="side bottom"></div>
        <div class="button power"></div><div class="button action"></div><div class="button vol1"></div><div class="button vol2"></div>

        <section class="face front">
          <div class="screen">
            <div class="island"></div>
            <div class="screen-content">
              <div class="status"><span id="statusTime">9:41</span><span class="signals"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="wifi">◒</span><span class="battery"><b></b></span></span></div>
              <div class="hero-widget">
                <div class="clockbox"><div class="clock" id="clock">9:41</div><div class="date" id="date">Monday, September 21</div></div>
                <div class="mini-weather"><strong>22°</strong><small>Clear · Lovely day</small></div>
              </div>
              <div class="apps">
                <div class="app photos" data-app="Photos"><div class="icon"><span class="glyph">✿</span></div><span class="label">Photos</span></div>
                <div class="app camera" data-app="Camera"><div class="icon"><span class="glyph">◉</span></div><span class="label">Camera</span></div>
                <div class="app mail" data-app="Mail"><div class="icon"><span class="glyph">✉</span></div><span class="label">Mail</span></div>
                <div class="app maps" data-app="Maps"><div class="icon"><span class="glyph">⌖</span></div><span class="label">Maps</span></div>
                <div class="app clockapp" data-app="Clock"><div class="icon"><span class="glyph">◷</span></div><span class="label">Clock</span></div>
                <div class="app health" data-app="Health"><div class="icon"><span class="glyph">♥</span></div><span class="label">Health</span></div>
                <div class="app notes" data-app="Notes"><div class="icon"><span class="glyph">≡</span></div><span class="label">Notes</span></div>
                <div class="app settings" data-app="Settings"><div class="icon"><span class="glyph">⚙</span></div><span class="label">Settings</span></div>
              </div>
              <div class="dock">
                <div class="app phoneapp" data-app="Phone"><div class="icon"><span class="glyph">☎</span></div><span class="label">Phone</span></div>
                <div class="app safari" data-app="Safari"><div class="icon"><span class="glyph">➤</span></div><span class="label">Safari</span></div>
                <div class="app messages" data-app="Messages"><div class="icon"><span class="glyph">●</span></div><span class="label">Messages</span></div>
                <div class="app music" data-app="Music"><div class="icon"><span class="glyph">♪</span></div><span class="label">Music</span></div>
              </div>
            </div>
            <div class="toast" id="toast">App</div>
            <div class="homebar"></div>
          </div>
        </section>

        <section class="face back">
          <div class="camera-bump">
            <div class="lens l1"></div><div class="lens l2"></div><div class="lens l3"></div>
            <div class="flash"></div><div class="lidar"></div>
          </div>
          <div class="applemark">●</div>
          <div class="back-title">Lovely iPhone · 3D Interactive</div>
        </section>
      </div>
    </div>
    <div class="ground"></div>
    <div class="hint">Drag to rotate · Scroll to zoom · Double-click to reset</div>
  </main>

  <script>
    const phone = document.getElementById('phone');
    const wrap = document.getElementById('phoneWrap');
    const root = document.documentElement;
    const toast = document.getElementById('toast');
    let rx=-4, ry=-14, zoom=1, dragging=false, sx=0, sy=0, srx=0, sry=0, moved=false, toastTimer;

    function apply(){
      root.style.setProperty('--rx', rx+'deg');
      root.style.setProperty('--ry', ry+'deg');
      root.style.setProperty('--zoom', zoom);
    }
    function stopFloat(){ phone.classList.remove('resting'); }
    function resumeFloat(){ if(!dragging) setTimeout(()=>phone.classList.add('resting'), 1400); }

    window.addEventListener('pointerdown', e=>{
      if(e.target.closest('.app')) return;
      dragging=true;moved=false;sx=e.clientX;sy=e.clientY;srx=rx;sry=ry;
      stopFloat(); try{phone.setPointerCapture(e.pointerId)}catch{}
    });
    window.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx=e.clientX-sx,dy=e.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
      ry=sry+dx*.34; rx=Math.max(-38,Math.min(38,srx-dy*.24)); apply();
    });
    window.addEventListener('pointerup', ()=>{dragging=false;resumeFloat()});
    window.addEventListener('wheel', e=>{
      stopFloat(); zoom=Math.max(.72,Math.min(1.22,zoom-e.deltaY*.00055));apply();resumeFloat();
    },{passive:true});
    window.addEventListener('dblclick', ()=>{
      stopFloat();rx=-4;ry=-14;zoom=1;apply();resumeFloat();
    });

    document.querySelectorAll('.app').forEach(app=>{
      app.addEventListener('pointerdown', e=>e.stopPropagation());
      app.addEventListener('click', e=>{
        e.stopPropagation();
        const name=app.dataset.app;
        toast.textContent=name+' · iOS 27';
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer=setTimeout(()=>toast.classList.remove('show'),1200);
      });
    });

    function updateClock(){
      const now=new Date();
      const t=now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
      const d=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
      document.getElementById('clock').textContent=t;
      document.getElementById('statusTime').textContent=t;
      document.getElementById('date').textContent=d;
    }
    updateClock(); setInterval(updateClock,30000);

    // Subtle pointer parallax when not dragging.
    window.addEventListener('pointermove', e=>{
      if(dragging || innerWidth<700) return;
      const x=(e.clientX/innerWidth-.5), y=(e.clientY/innerHeight-.5);
      wrap.style.transform=\`scale(\${zoom}) translate3d(\${x*7}px,\${y*5}px,0)\`;
    });
    window.addEventListener('pointerleave',()=>{wrap.style.transform=\`scale(\${zoom})\`});
  </script>
</body>
</html>
